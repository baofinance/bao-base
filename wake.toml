[lsp]
compilation_delay = 0.1

[compiler.solc.optimizer]
# enabled=false # unset = let the compiler decide
runs = 1

[compiler.solc]
# Exclude paths define locations of Solidity files that should not be compiled unless imported from another non-excluded file.
exclude_paths = ["node_modules", "venv", "lib"]
# include paths are for import resolution
include_paths = []
remappings = [
  "ds-test/=lib/forge-std/lib/ds-test/src/",
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  # Must stay identical to the same block in foundry.toml — `yarn doctor` fails when wake and forge
  # resolve an import differently, because then wake analyses a program that is not the one built.
  # OZ 5.6.x deletes ReentrancyGuardTransientUpgradeable, and 5.7.0 reduces UUPSUpgradeable to a
  # re-export of the non-upgradeable core (dropping Initializable from its bases and the empty
  # __UUPSUpgradeable_init shims). Redirect those import PATHS to byte-identical @bao shims, so
  # deployed sources keep the exact OZ import they were audited with.
  # Longest-prefix match wins over the broader contracts-upgradeable/ rule above.
  "@openzeppelin/contracts-upgradeable/utils/ReentrancyGuardTransientUpgradeable.sol=src/openzeppelin-compat/ReentrancyGuardTransientUpgradeable.sol",
  "@openzeppelin/contracts-upgradeable/proxy/utils/UUPSUpgradeable.sol=src/openzeppelin-compat/UUPSUpgradeable.sol",
  "@solady/=lib/solady/src/",
  "openzeppelin-foundry-upgrades/=lib/openzeppelin-foundry-upgrades/src/",
  "solidity-stringutils/=lib/openzeppelin-foundry-upgrades/lib/solidity-stringutils/",
  "@bao/=src/",
  "@bao-test/=test/",
  "@bao-script/=script/",
  "@bao-factory/=lib/bao-factory/src/",
  "@bao-factory-test/=lib/bao-factory/test/",
  "src/=src/",
  "test/=test/",
]


[lsp.code_lens]
enable = true

[lsp.detectors]
enable = true

[detectors]
# ignore_paths = ["test"]
# exclude_paths = ["node_modules", "lib", "script"]
# only = []
exclude = [
  #  "abi-encode-with-signature",
  #  "axelar-proxy-contract-id",
  #  "balance-relied-on",
  #  "calldata-tuple-reencoding-head-overflow-bug",
  #  "call-options-not-called",
  #  "empty-byte-array-copy-bug",
  #  "msg-value-nonpayable-function",
  #  "unused-contract",
  #  "unchecked-return-value"
]

[printers]
# only = []
exclude = [
  #   "control-flow-graph",
  #   "imports-graph",
  #   "inheritance-graph",
  #   "inheritance-tree",
  #   "lsp-control-flow-graph",
  #   "lsp-inheritance-graph",
  #   "lsp-linearized-inheritance-graph",
  #   "lsp-selectors",
  #   "modifiers",
  #   "state-changes",
  #   "storage-layout",
  #   "tokens",
]

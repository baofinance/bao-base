name: test-foundry-stable

on:
  # Branch pushes only. A tag push would run CI on the commit the tag names - for a deployment tag an old
  # source commit, built with today's tools - which proves nothing about the code being worked on.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Least privilege. The token is needed to clone the repository and its submodules, and to read
# foundry's public releases when resolving a nightly tag — both covered by contents:read. Without
# this block the workflow inherits the repository default, which is commonly write access to every
# scope, so any step (or any action it calls) could push to the repo or publish a release.
permissions:
  contents: read

env:
  MAINNET_RPC_URL: https://eth-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test_foundry_os:
    strategy:
      max-parallel: 1
      fail-fast: false # ensure all jobs run even if one fails
      matrix:
        include:
          - os: ubuntu-latest
            foundry: stable

          - os: macos-latest
            foundry: stable

          # - os: windows-latest
          #   foundry: stable

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # full history
          fetch-depth: 0

      - name: Check out every submodule, at every depth
        # What a member's clone holds (bao-base's doc/dependencies.md). The build reads some of the
        # nested ones. Commits and folders only: git fetches a file's content when something reads it.
        run: git submodule update --init --recursive --filter=blob:none --jobs 8

      - name: Run Bao-base CI actions
        uses: ./.github/actions/test-foundry
        with:
          foundry: ${{ matrix.foundry }}

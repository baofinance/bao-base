name: test-scripting

on:
  # Branch pushes only. A tag push would run CI on the commit the tag names - for a deployment tag an old
  # source commit, built with today's tools - which proves nothing about the code being worked on.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  MAINNET_RPC_URL: https://eth-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_KEY }}

jobs:
  test_scripting_os:
    strategy:
      max-parallel: 1
      fail-fast: false # ensure all jobs run even if one fails
      matrix:
        include:
          - os: ubuntu-22.04
            foundry: stable

          - os: macos-14
            foundry: stable

          # - os: windows-2022
          #   foundry: stable

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v3
        with:
          # Each submodule of this repository, and none inside them: the action's dep sync step adds
          # the ones inside that a remapping uses, which is all the build reads.
          submodules: true

      - name: Run Bao-base CI actions
        uses: ./.github/actions/test-scripting
        with:
          foundry: ${{ matrix.foundry }}

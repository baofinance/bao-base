name: test-scripting

on:
  # Branch pushes only. A tag push would run CI on the commit the tag names - for a deployment tag an old
  # source commit, built with today's tools - which proves nothing about the code being worked on.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  MAINNET_RPC_URL: https://eth-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_KEY }}

jobs:
  test_scripting_os:
    strategy:
      max-parallel: 1
      fail-fast: false # ensure all jobs run even if one fails
      matrix:
        include:
          - os: ubuntu-latest
            foundry: stable

          - os: macos-latest
            foundry: stable

          # - os: windows-latest
          #   foundry: stable

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        # no need for full history

      - name: Check out every submodule, at every depth
        # What a member's clone holds (bao-base's doc/dependencies.md). The build reads some of the
        # nested ones. Commits and folders only: git fetches a file's content when something reads it.
        run: git submodule update --init --recursive --filter=blob:none --jobs 8

      - name: Run Bao-base CI actions
        uses: ./.github/actions/test-scripting
        with:
          foundry: ${{ matrix.foundry }}

name: Test Foundry
description: "runs all the tests for a Foundry solidity project"

# secrets:
#   DEFAULT_MAINNET_RPC_URL:
#     description: "default API URL for accessing blockchain service"
#     required: false
inputs:
  # os:
  #   description: "Operating system to test"
  #   required: true
  #   type: string
  foundry:
    description: "Foundry version to test"
    required: true
  cwd:
    description: "Directory to run commands in"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: Check Environment
      shell: bash
      run: |
        echo "runner.os=${{ runner.os }}"
        python3 -c "import platform; info = f'{platform.system()} {platform.release()} {platform.version()} {platform.machine()}'; print('-' * len(info)); print(info); print('-' * len(info))"
        bash --version

    - name: Install Bash 5.2 (on macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install bash
        bash --version

    - name: Check the workflows copied from bao-base
      shell: bash
      run: |
        # This repo's copies of bao-base's workflows still match the originals. Placed before the
        # expensive setup because it needs none of it — bao-base's run provisions its own python —
        # so drift is reported in seconds instead of after foundry, node and a full install. It is
        # the only check run from here on purpose; see bin/workflow_copy.py for why adding a second
        # is a decision rather than a tidy-up.
        #
        # bao-base is lib/bao-base in a consumer and the repo itself when bao-base IS the repo, and
        # `uses:` takes no expressions so the path cannot be supplied where the action is referenced.
        # Both cases fit in the one command, which is also what bin/CI replays locally — so the step
        # is the same line of shell wherever it runs. A repo with neither fails on the missing file,
        # which is the honest outcome: there is no bao-base to check against.
        cd ${{ inputs.cwd }}
        # ci-execute-next-line
        if [[ -d lib/bao-base ]]; then lib/bao-base/run workflow_copy; else ./run workflow_copy; fi
      id: workflow-copy

    - name: Install uv python framework
      shell: bash
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | bash
      id: uv-install

    - name: Resolve latest nightly tag
      id: nightly
      if: inputs.foundry == 'nightly'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # foundryup's own "latest nightly" lookup is unauthenticated and gets
        # rate-limited (esp. on macOS shared runner IPs), so resolve the concrete
        # tag here with auth and hand foundryup a fixed tag instead.
        tag=$(gh api repos/foundry-rs/foundry/releases \
          --jq 'map(select(.tag_name | startswith("nightly")))[0].tag_name')
        if [[ -z "$tag" ]]; then
          echo "Could not resolve a nightly release tag" >&2
          exit 1
        fi
        echo "Resolved nightly -> $tag"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: ${{ steps.nightly.outputs.tag || inputs.foundry }}
        cache-key: fork-24699497 # change this number and update the bao-base BaoTest's forkMainnet() function
      id: foundry-install

    - shell: bash
      run: |
        # foundry version
        forge --version

    - name: Install python project dependencies (if any)
      shell: bash
      run: |
        # install python project dependencies
        cd ${{ inputs.cwd }}
        [[ -f pyproject.toml ]] && uv sync || echo "No pyproject.toml found, skipping python dependencies installation"

    - name: Install node
      uses: actions/setup-node@v6
      with:
        node-version: 25

    - name: Install node project dependencies
      shell: bash
      run: |
        # install node project dependencies
        cd ${{ inputs.cwd }}
        corepack enable
        yarn

    - name: Run the project's debug script (if any)
      shell: bash
      run: |
        # A repo's own pre-test diagnostic — typically reporting whether the secrets its fork tests
        # need actually arrived. Optional; bin/optional-yarn-script says why it is a package.json
        # script rather than a step added here, and what its output means.
        #
        # Placed here rather than first because it is a yarn script and yarn does not exist until the
        # step above — still ahead of everything slow. The bao-base path is spelled the same way as
        # in the workflow-copy step above, for the same reason given there.
        cd ${{ inputs.cwd }}
        # ci-execute-next-line
        if [[ -d lib/bao-base ]]; then lib/bao-base/run optional-yarn-script debug; else ./run optional-yarn-script debug; fi
      id: debug

    - name: Check audit and deployed code
      shell: bash
      run: |
        # verify code at certain tags has not been changed since that tag
        cd ${{ inputs.cwd }}; pwd
        # ci-execute-next-line
        yarn verify-audit
      id: verify-audit

    - name: Run Prettier
      shell: bash
      run: |
        # run prettier to check formatting
        cd ${{ inputs.cwd }}
        # ci-execute-next-line
        yarn fmt:check
      id: fmt-check

    - name: Run Solhint
      shell: bash
      run: |
        # run solhint
        cd ${{ inputs.cwd }}
        # ci-execute-next-line
        yarn lint
      id: lint

    - name: Run Slither
      shell: bash
      run: |
        # run slither
        cd ${{ inputs.cwd }}
        # ci-execute-next-line
        yarn slither
      id: slither

    - name: Run Forge build, generating contract sizes reports into the regression folder - if they differ from the ones in the repo, they will be failed in the git-diffs step
      if: runner.os != 'Windows' # TODO: for some reason, the sizes processing doesn't work on windows
      shell: bash
      run: |
        # generate contract sizes reports into the regression folder - if they differ from the ones in the repo, they will be failed in the git-diffs step
        cd ${{ inputs.cwd }}
        # ci-execute-next-line
        yarn sizes
      id: sizes

    - name: Run Forge tests
      shell: bash
      run: |
        # run all the foundry tests in the test folder
        cd ${{ inputs.cwd }}
        # ci-execute-next-line
        yarn test
      id: test

    - name: Run Lint on Forge tests
      shell: bash
      run: |
        # run all the foundry tests in the test folder
        cd ${{ inputs.cwd }}
        # ci-execute-next-line
        yarn lint:test
      id: lint-test

    - name: Run Forge tests - coverage
      if: runner.os != 'Windows' # TODO: for some reason, the coverage processing doesn't work on windows
      shell: bash
      run: |
        # generate coverage reports into the regression folder - if they differ from the ones in the repo, they will be failed in the git-diffs step
        cd ${{ inputs.cwd }}
        # ci-execute-next-line
        yarn coverage
      id: coverage

    - name: Run Forge tests - gas
      if: runner.os != 'Windows' # TODO: for some reason, the gas processing doesn't work on windows
      shell: bash
      run: |
        # generate gas reports into the regression folder - if they differ from the ones in the repo, they will be failed in the git-diffs step
        cd ${{ inputs.cwd }}
        # ci-execute-next-line
        yarn gas
      id: gas

    - name: Run upgradeable contract deployment validation
      shell: bash
      run: |
        # check all contracts for deployment upgradeability
        cd ${{ inputs.cwd }}
        # ci-execute-next-line
        yarn validate
      id: validate

    - name: Check for changed repo files
      shell: bash
      run: |
        # if there are any added or changed (excluding staged) files then list them and fail
        cd ${{ inputs.cwd }}
        if ! git diff --quiet || [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
          git status --short
          git diff | head -100
          echo "Git repo has changed, either correctly fix those files locally or .gitignore them"; exit 1;
        fi
      id: git-diffs

    - name: Check some wtf's
      shell: bash
      run: |
        # A repo's own bespoke checks — the same optional-script mechanism as the debug step above,
        # differing only in that here the output IS the verdict: these print nothing when they are
        # happy, so anything printed is an issue found. That is what --output-means-failure selects.
        cd ${{ inputs.cwd }}
        # ci-execute-next-line
        if [[ -d lib/bao-base ]]; then lib/bao-base/run optional-yarn-script wtf --output-means-failure; else ./run optional-yarn-script wtf --output-means-failure; fi
      id: wtf

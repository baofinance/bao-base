[profile.default]
libs = ["lib"] # forge's default adds node_modules
auto_detect_remappings = false # remappings seem to cause problems
optimizer = true
optimizer_runs = 200
# via_ir = true
ffi = true # needed for atomic file writes (mv command)

deny = "warnings"


remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "@solady/=lib/solady/src/",
  "openzeppelin-foundry-upgrades/=lib/openzeppelin-foundry-upgrades/src/",
  "@bao/=src/",
  "@bao-test/=test/",
  "@bao-script/=script/",
  "@bao-factory/=lib/bao-factory/src/",
  "@bao-factory-test/=lib/bao-factory/test/",
]


fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./results" },
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "./tmp" },
]

#ignored_error_codes=["transient-storage"]
ignored_warnings_from = [
  "lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/utils/StorageSlot.sol",
]

gas_reports_ignore = [
  "ERC20Mock",
  "ERC1967Proxy",
  "DerivedBaoOwnable",
  "DerivedBaoOwnableRoles",
  "DerivedBaoOwnableRoles_v2",
  "DerivedBaoOwnableTransferrable",
  "DerivedBaoOwnableTransferrableRoles",
  "DerivedBaoOwnable_v2",
  "DerivedOwnable",
  "DerivedOwnableRoles",
  "DerivedTokenHolder",
  "BaoOwnableAdapter",
  "MockImplementationWithState",
]

# The compiler: at most 0.8.30, for every file. The pragmas allow later versions, and one test fixture pins 0.8.28,
# so no single version satisfies every file. Without this cap forge splits a build and gives part of it the newest
# compiler installed (tests/toolchain/test_solc_version_choice.py).
[[profile.default.compilation_restrictions]]
paths = "**/*.sol"
version = "<=0.8.30"

[lint]
exclude_lints = [
  "mixed-case-function",
  "mixed-case-variable",
  "screaming-snake-case-constant",
]
severity = ["gas"]

[etherscan]
mainnet = { key = "${ETHERSCAN_KEY}" }

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"
local = "http://localhost:8545"


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[profile.default]
src = "src"
out = "out"
libs = ["lib"]

auto_detect_remappings = false # remappings seem to cause problems
optimizer = true
optimizer_runs = 200
# via_ir = true
gas_limit = "18446744073709551615"
fuzz.gas_report_samples = 64       # gas report doesn't need so many test cases
ffi = true                         # needed for atomic file writes (mv command)

deny = "warnings"


remappings = [
  "ds-test/=lib/forge-std/lib/ds-test/src/",
  "forge-std/=lib/forge-std/src/",
  # OZ 5.7.0 reduced contracts-upgradeable's UUPSUpgradeable to a re-export of the non-upgradeable
  # core, dropping Initializable from its base list — and with it the initializer/_disableInitializers
  # that deployed contracts reach through it — and the empty __UUPSUpgradeable_init shims their
  # on-chain initializers call. This directory restores the 5.1 file.
  #
  # Redirecting the PATH rather than editing the imports is what lets deployed sources keep the exact
  # import they were audited with, and what lets old revisions still build under verify-audit, which
  # compiles a tag's source against HEAD's foundry.toml.
  #
  # A whole-directory prefix, and FIRST in this list, for two measured reasons. Forge resolves an
  # exact-file remapping literally in its dependency pre-pass and compiles OZ's copy anyway, leaving a
  # second UUPSUpgradeable for the collision check to reject; a prefix it honours, so OZ's proxy/utils/
  # never enters the build — which is why Initializable.sol is re-exported alongside. And matching is
  # by ORDER here, not by longest prefix: below the broader contracts-upgradeable/ rule this silently
  # does nothing, and HarborPauser_v1 fails to find _disableInitializers.
  "@openzeppelin/contracts-upgradeable/proxy/utils/=src/openzeppelin-compat/proxy/utils/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  # OZ 5.6.x deletes ReentrancyGuardTransientUpgradeable outright, so the shim can keep OZ's name
  # without colliding with anything, and an exact-file remapping is enough — there is no OZ copy left
  # for the pre-pass to compile. Exercised only by old revisions under verify-audit; TokenHolder at
  # HEAD imports the shim directly, because a remapped path whose file OZ deleted makes that pre-pass
  # log "Unable to resolve imports" on every build.
  "@openzeppelin/contracts-upgradeable/utils/ReentrancyGuardTransientUpgradeable.sol=src/openzeppelin-compat/ReentrancyGuardTransientUpgradeable.sol",
  "@solady/=lib/solady/src/",
  "openzeppelin-foundry-upgrades/=lib/openzeppelin-foundry-upgrades/src/",
  "solidity-stringutils/=lib/openzeppelin-foundry-upgrades/lib/solidity-stringutils/",
  "@bao/=src/",
  "@bao-test/=test/",
  "@bao-script/=script/",
  "@bao-factory/=lib/bao-factory/src/",
  "@bao-factory-test/=lib/bao-factory/test/",
  "src/=src/",
  "test/=test/",
]


fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./results" },
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "./tmp" },
]

#ignored_error_codes=["transient-storage"]
ignored_warnings_from = [
  "lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/utils/StorageSlot.sol",
]

gas_reports_ignore = [
  "ERC20Mock",
  "ERC1967Proxy",
  "DerivedBaoOwnable",
  "DerivedBaoOwnableRoles",
  "DerivedBaoOwnableRoles_v2",
  "DerivedBaoOwnableTransferrable",
  "DerivedBaoOwnableTransferrableRoles",
  "DerivedBaoOwnable_v2",
  "DerivedOwnable",
  "DerivedOwnableRoles",
  "DerivedTokenHolder",
  "BaoOwnableAdapter",
  "MockImplementationWithState",
]

[lint]
exclude_lints = [
  "mixed-case-function",
  "mixed-case-variable",
  "screaming-snake-case-constant",
]
severity = ["gas"]

[etherscan]
mainnet = { key = "${ETHERSCAN_KEY}" }

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
mainnet = "${MAINNET_RPC_URL}"
local = "http://localhost:8545"


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

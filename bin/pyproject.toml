[project]
name = "bao-base_bin"
version = "0.1.0"
description = "Bao Finance base utilities"
requires-python = ">=3.9,<3.14"

dependencies = [
  # Core data utilities
  "pandas~=2.2.3",
  "tabulate~=0.9.0",
  "toml~=0.10.2",
  "python-dotenv~=1.1.0",
  # Coloured terminal output (doctor.py pass/fail report)
  "rich~=13.7",
  # keccak256, for deployed.json's bytecode digests. The ecosystem hashes with keccak and `cast
  # keccak` is what anyone checking a value by hand will reach for; sha256 was chosen only because it
  # is in the stdlib, which is convenience deciding a format others have to verify against.
  "pycryptodome~=3.20",
  # Stage timings for deployment recovery: a named timer per stage writes its own line and keeps
  # per-stage totals for the closing summary, so nothing is parsed back out of the log.
  "codetiming~=1.4",
  # [tool.pytest.ini_options]
  # testpaths = ["tests"]
  # python_files = "test_*.py"
  # Testing frameworks
  "pytest~=7.4.0",
  "pytest-cov~=4.1.0",
  "pytest-xdist~=3.5.0",
  # Additional test dependencies
  "coverage~=7.3.2",
  # JSONC parsing (doctor reads .vscode/settings.json)
  "json5>=0.15.0",
]

